<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volt — model review</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="volt-preview">
      <section class="volt-preview__stage" aria-label="Interactive Volt model">
        <div id="viewport"></div>
        <p id="status" role="status">Preparing Volt…</p>
      </section>
      <aside class="volt-preview__controls">
        <h1>Volt</h1>
        <p>Model review</p>
        <label class="setting-row">Lighting
          <select id="lighting"><option value="studio">Studio</option><option value="blackout">Blackout</option><option value="blackout-powered">Blackout powered</option></select>
        </label>
        <label class="setting-row">Distance <output id="distance-value">5.2 m</output>
          <input id="distance" aria-label="Camera distance in metres" type="range" min="3.5" max="7" step="0.1" value="5.2" />
        </label>
        <div class="volt-preview__views" role="group" aria-label="Model view">
          <button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="three-quarter">¾</button>
        </div>
        <div id="morph-controls"></div>
        <div class="volt-preview__actions"><button id="animate" aria-pressed="false">Play motion</button><button id="reset">Reset</button></div>
        <p class="volt-preview__hint">Drag to orbit. The camera uses the game’s field of view and follow distances.</p>
      </aside>
    </main>
    <script type="module" src="../src/debug/VoltModelPreview.ts"></script>
  </body>
</html>
