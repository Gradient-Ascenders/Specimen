name: Prepare music assets (branch only)
on:
  push:
    branches:
      - feat/level-soundtracks-20261017
    paths:
      - scripts/prepare-soundtrack.py
      - .github/workflows/prepare-soundtrack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  soundtrack-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required encoder
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Fetch, verify and encode the selected tracks
        run: python3 scripts/prepare-soundtrack.py
      - name: Confirm the four browser audio files decode
        run: |
          test "$(find public/assets/audio/music -maxdepth 1 -name '*.ogg' | wc -l)" -eq 4
          for file in public/assets/audio/music/*.ogg; do
            ffmpeg -v error -xerror -i "$file" -f null -
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$file"
          done
      - name: Commit only the prepared OGG files to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/music/*.ogg
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): add normalized music tracks for all levels"
            git push origin HEAD:feat/level-soundtracks-20261017
          fi
