name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v7

      - name: Use pinned Node.js version and cache npm downloads
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  production-build:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v7

      - name: Use pinned Node.js version and cache npm downloads
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # build already runs tsc. Do not type-check or build a second time.
      - name: Build for production
        run: npm run build

      - name: Validate production layout and references
        run: npm run validate:production

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test production at a nested path
        run: npm run test:smoke

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
