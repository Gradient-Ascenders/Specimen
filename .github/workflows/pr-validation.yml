name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use pinned Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Build and validate production archive
        run: npm run archive

      - name: Upload validated production archive
        uses: actions/upload-artifact@v4
        with:
          name: specimen-production
          path: artifacts/specimen-production.zip
          if-no-files-found: error
          retention-days: 14
