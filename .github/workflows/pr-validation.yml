name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v7

      - name: Use pinned Node.js version and cache npm downloads
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify baked asset reproducibility
        run: npm run check:generated-assets

      - name: Run tests
        run: npm test

  production-build:
    name: Production smoke (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v7

      - name: Use pinned Node.js version and cache npm downloads
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci

      # build already runs tsc. Do not type-check or build a second time.
      - name: Build for production
        run: npm run build

      - name: Validate production layout and references
        run: npm run validate:production

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test production at a nested path
        timeout-minutes: 8
        # Keep every existing smoke test. Each runner has its own one-worker
        # software-WebGL process, avoiding CPU contention on one machine.
        run: npm run test:smoke -- --fully-parallel --shard=${{ matrix.shard }}/2

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-browser-diagnostics-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  production-smoke:
    # Preserve the existing required-check name for branch protection.
    name: Production smoke
    needs: production-build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both smoke shards to pass
        env:
          SHARD_RESULT: ${{ needs.production-build.result }}
        run: test "$SHARD_RESULT" = success
