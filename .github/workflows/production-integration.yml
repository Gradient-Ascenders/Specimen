name: Production integration

on:
  # Extended coverage runs outside the PR/submission path, or on demand.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: production-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-integration:
    name: Production integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out integration revision
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          browser: chromium

      - name: Build for production
        run: npm run build

      - name: Validate production layout and references
        run: npm run validate:production

      - name: Run production integration journeys
        timeout-minutes: 25
        run: npm run test:integration -- --grep @nightly

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-integration-${{ github.run_id }}-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox-smoke:
    name: Firefox smoke
    runs-on: ubuntu-latest
    # Cold Firefox/system-library installation can take longer than the test.
    timeout-minutes: 20
    steps:
      - name: Check out integration revision
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          browser: firefox

      - name: Build for production
        run: npm run build

      - name: Install Mesa software OpenGL
        run: sudo apt-get install --yes --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Smoke-test production startup
        timeout-minutes: 5
        env:
          SPECIMEN_BROWSER_NAME: firefox
          SPECIMEN_FIREFOX_SOFTWARE_WEBGL: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run --auto-servernum npx playwright test --project=smoke
          --grep "plain production boots"
          --headed

      - name: Upload Firefox diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-smoke-${{ github.run_id }}-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  extended-smoke:
    name: Extended smoke (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browser: chromium
      - run: npm run build
      - run: npm run validate:production
      - name: Run profile and multi-level journeys
        run: npm run test:smoke -- --grep @extended --fully-parallel --shard=${{ matrix.shard }}/2
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extended-smoke-${{ matrix.shard }}-diagnostics
          path: |
            playwright-report/
            test-results/
            artifacts/evidence/
          if-no-files-found: ignore
          retention-days: 7
