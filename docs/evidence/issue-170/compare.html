<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue 170 — character shadow evidence</title>
<style>
  body { margin: 0; padding: 1.5rem; font: 1rem system-ui; color: #e7eeee; background: #121919; }
  main { max-width: 1500px; margin: auto; }
  h1 { font-size: 1.4rem; }
  a { color: #9fe7eb; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,420px),1fr)); gap: 1rem; }
  label { display: grid; gap: .5rem; }
  select { font: inherit; padding: .5rem; color: inherit; background: #263333; }
  img { width: 100%; display: block; margin-top: .75rem; }
  p { max-width: 90ch; line-height: 1.5; }
</style>
<main>
  <h1>Issue #170 — character shadow evidence</h1>
  <p>Physical Intel Iris Xe / Chrome 154, 960 × 600, DPR 1. Compare visible pose and projected shadow, fade coverage, rupture/recovery and the existing dissolve mask. Point views use staged placement inside the authored Volt pod. Read <a href="review.md">review notes and limits</a>.</p>
  <div class="pair">
    <label>Left view<select id="left"></select><img id="left-image" alt="Standing Bob and his spotlight shadow"></label>
    <label>Right view<select id="right"></select><img id="right-image" alt="Faded Bob and reduced spotlight shadow coverage"></label>
  </div>
</main>
<script>
  const views = [
    ['spot-standing','Spot: standing'], ['spot-moving','Spot: movement'], ['spot-charging','Spot: charging'],
    ['spot-jumping','Spot: jumping'], ['spot-landing','Spot: landing'], ['spot-impact','Spot: staged impact'],
    ['spot-faded','Spot: opacity 0.25'], ['spot-zero-opacity','Spot: opacity zero'], ['spot-hidden','Spot: hidden'],
    ['spot-death-anticipation','Spot: death anticipation'], ['spot-rupture','Spot: rupture'], ['spot-recovered','Spot: recovery'],
    ['point-standing','Point: standing'], ['point-impact','Point: staged impact'], ['point-charging','Point: staged charging'],
    ['point-faded','Point: opacity 0.25'], ['point-zero-opacity','Point: opacity zero'],
    ['point-dissolve-intact','Point: staged dissolve intact'], ['point-dissolve-half','Point: staged dissolve 0.5'],
    ['point-dissolve-complete','Point: staged dissolve complete'], ['point-dissolve-reset','Point: staged dissolve reset']
  ];
  for (const [id,initial] of [['left','spot-standing'],['right','spot-faded']]) {
    const select = document.getElementById(id), image = document.getElementById(`${id}-image`);
    for (const [key,label] of views) select.add(new Option(label,key));
    const update = () => { image.src = `iris-xe/${select.value}.png`; image.alt = select.selectedOptions[0].text + ' — visible geometry and authored-source shadow'; };
    select.value = initial; select.addEventListener('change',update); update();
  }
</script>
</html>
