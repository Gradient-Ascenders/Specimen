<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bob Gate 1 neutral candidate review</title>
  <link rel="icon" href="data:,">
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#41474b}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {CameraRig} from '../../../../src/render/CameraRig.ts';
import {CollisionWorld} from '../../../../src/physics/CollisionWorld.ts';

const scene=new THREE.Scene();
scene.background=new THREE.Color('#41474b');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight);
document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x46505a,2));
const key=new THREE.DirectionalLight(0xffffff,2.3);
key.position.set(-3,5,-4);
scene.add(key);
const rig=new CameraRig();
const position=new THREE.Vector3();
rig.setFollowTarget({position,previousPosition:position,velocity:new THREE.Vector3(),
  gameplayUp:new THREE.Vector3(0,1,0),grounded:true,attached:false},new CollisionWorld());
rig.setGroundOrbitYawRadians(THREE.MathUtils.degToRad(155));
rig.resize(innerWidth,innerHeight);
const asset=await new GLTFLoader().loadAsync(new URL('../../../../assets/characters/bob/bob-curl-candidate.glb',import.meta.url).href);
scene.add(asset.scene);
rig.update(1,1/60);
renderer.render(scene,rig.camera);
window.bobReview={ready:true,triangles:renderer.info.render.triangles,
  camera:{position:rig.camera.position.toArray(),fov:rig.camera.fov,distance:rig.currentFollowDistanceMetres},
  candidate:asset.scene.getObjectByName('Bob-Gate-One').userData.candidate};
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  rig.resize(innerWidth,innerHeight);
  renderer.render(scene,rig.camera);
});
</script>
</body>
</html>
